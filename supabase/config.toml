# Supabase projekt konfiguráció
# Szükséges a Supabase CLI-hez (supabase start, supabase db push, stb.)
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = ""

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "https://next.gyuminaptar.hu"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# ── Edge Functions ────────────────────────────────────────────────────────────

[functions.keycloak-gateway]
verify_jwt = false

# Napi gyümölcs-emlékeztető: minden nap 05:00 UTC (= 07:00 nyári CEST)
# A function maga is Europe/Budapest TZ-aware, így télen is jól számol.
[functions.daily-fruit-reminder]
verify_jwt = false

[analytics]
enabled = false
port = 54327
backend = "postgres"
